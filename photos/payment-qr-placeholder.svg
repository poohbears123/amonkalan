<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" role="img" aria-label="Payment QR placeholder">
  <defs>
    <pattern id="mod" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ffffff"/>
      <rect width="10" height="10" fill="#161616"/>
      <rect x="10" y="10" width="10" height="10" fill="#161616"/>
    </pattern>
  </defs>
  <rect width="380" height="380" fill="#ffffff"/>
  <rect x="20" y="20" width="340" height="340" fill="url(#mod)"/>
  <!-- top-left finder -->
  <g>
    <rect x="20" y="20" width="90" height="90" fill="#ffffff"/>
    <rect x="30" y="30" width="70" height="70" fill="#161616"/>
    <rect x="40" y="40" width="50" height="50" fill="#ffffff"/>
    <rect x="50" y="50" width="30" height="30" fill="#161616"/>
  </g>
  <!-- top-right finder -->
  <g>
    <rect x="270" y="20" width="90" height="90" fill="#ffffff"/>
    <rect x="280" y="30" width="70" height="70" fill="#161616"/>
    <rect x="290" y="40" width="50" height="50" fill="#ffffff"/>
    <rect x="300" y="50" width="30" height="30" fill="#161616"/>
  </g>
  <!-- bottom-left finder -->
  <g>
    <rect x="20" y="270" width="90" height="90" fill="#ffffff"/>
    <rect x="30" y="280" width="70" height="70" fill="#161616"/>
    <rect x="40" y="290" width="50" height="50" fill="#ffffff"/>
    <rect x="50" y="300" width="30" height="30" fill="#161616"/>
  </g>
  <text x="190" y="196" font-family="Georgia, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#ffffff">QR placeholder</text>
</svg>
